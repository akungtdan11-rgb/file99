<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>idoDownload</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;background:#f5f5f5
}
.box{
  width:90%;max-width:400px;padding:35px 25px;text-align:center;
  background:#fff;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.08)
}
h1{margin:0 0 10px}
p{color:#777;margin:0 0 25px}
.download{
  display:block;padding:14px;border-radius:10px;background:#111;color:#fff;
  text-decoration:none;font-weight:bold
}
.download:hover{opacity:.8}
</style>
</head>
<body>
<div class="box">
  <h1>idoDownload</h1>
  <p>Download file kamu di sini</p>
  <a class="download" href="https://example.com/file.zip" download>
    ⬇ DOWNLOAD
  </a>
</div>
</body>
</html>
