<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSINT Public Lite</title><style>body{font-family:system-ui;background:#080d18;color:#eef3ff;max-width:800px;margin:auto;padding:20px}.box{background:#111a2d;padding:18px;border-radius:15px;margin:10px 0}input,button{padding:12px;border-radius:10px;border:0;margin:5px 0}input{width:100%;background:#091221;color:white}button{background:#6ea8fe;font-weight:700}.card{background:#0b1322;padding:12px;border-radius:10px;margin:8px 0}.muted{color:#9aa9c4}a{color:#9fc4ff}</style></head><body><h1>🔎 OSINT Public Lite</h1><p class="muted">Pencarian dataset publik dengan sumber ditampilkan.</p><div class="box"><input id="q" placeholder="Contoh: PKH Kalimantan Timur"><button onclick="go()">🔍 Cari dataset</button><div id="s" class="muted"></div><div id="o"></div></div><script>const $=x=>document.getElementById(x);function e(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function go(){let q=$('q').value.trim();if(!q)return alert('Isi kata kunci');$('s').textContent='Mencari data.go.id...';$('o').innerHTML='';try{let r=await fetch('/api/datasets?q='+encodeURIComponent(q));let j=await r.json();if(!r.ok)throw Error(j.error||'Gagal');$('s').textContent='✓ '+(j.count||0)+' dataset · Sumber: data.go.id';$('o').innerHTML=(j.results||[]).map(d=>'<div class="card"><b>'+e(d.title)+'</b><p class="muted">Sumber/instansi: '+e(d.organization)+'</p><p>'+e(d.description||'Tidak ada deskripsi')+'</p><a target="_blank" href="'+e(d.dataset_url)+'">Buka dataset asli</a></div>').join('')||'<div class="card">Tidak ditemukan.</div>'}catch(x){$('s').textContent='⚠ '+x.message}}</script></body></html>
